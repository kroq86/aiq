[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlog"
version = "0.4.0"
description = "Database-agnostic event log core for durable agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Kirill Ostapenko", email = "djkroq@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
agentlog = "agentlog.evals.cli:main"

[tool.hatch.build]
exclude = [
    "/docs/release-evidence-0.3.md",
    "/docs/release-evidence-0.4.md",
]

[project.optional-dependencies]
ollama = [
    "httpx>=0.28,<1",
]
mcp = [
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
]
fastapi = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
test-fastapi = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
]
test = [
    "hypothesis>=6,<7",
    "pytest>=9,<10",
]
lint = [
    "ruff==0.15.12",
]
