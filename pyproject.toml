[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiq-runtime"
version = "0.5.2"
description = "Durable Python runtime for AI agents with event sourcing, guarded tools, replay, and SQLite lease fencing"
readme = "PYPI.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "agent-runtime",
    "durable-execution",
    "event-sourcing",
    "llm",
    "mcp",
    "workflow",
    "sqlite",
    "fastapi",
]
authors = [
    { name = "Kirill Ostapenko", email = "djkroq@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kroq86/aiq"
Repository = "https://github.com/kroq86/aiq"
Documentation = "https://github.com/kroq86/aiq/tree/main/docs"
Issues = "https://github.com/kroq86/aiq/issues"
Changelog = "https://github.com/kroq86/aiq/blob/main/CHANGELOG.md"

[project.scripts]
aiq = "aiq.evals.cli:main"

[tool.hatch.build]
exclude = [
    "/docs/release-evidence-0.3.md",
    "/docs/release-evidence-0.4.md",
    "/docs/release-evidence-0.5.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiq"]

[project.optional-dependencies]
ollama = [
    "httpx>=0.28,<1",
]
mcp = [
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
]
fastapi = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
test-fastapi = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
]
test = [
    "hypothesis>=6,<7",
    "pytest>=9,<10",
]
lint = [
    "ruff==0.15.12",
]
